services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: movie-rec-backend:latest
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: movie-rec-frontend:latest
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
  experiments:
